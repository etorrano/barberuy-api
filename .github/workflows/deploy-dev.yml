name: ci-dev
on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Prisma Generate
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Compress Files
        run: zip --symlinks -r barberuy-api.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{vars.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{vars.AWS_REGION}}

      - name: Install Elstic Beanstalk CLI
        run: |
          sudo apt-get install -y python3-pip
          pip3 install awsebcli --upgrade --user
          echo 'export PATH="$HOME/.local/bin:$PATH"' >> $HOME/.bashrc
          source $HOME/.bashrc

      - name: Init Elastic Beanstalk
        run: echo "n" | eb init barberuy-dev --region ${{vars.AWS_REGION}}

      - name: Deploy to Elastic Beanstalk
        run: eb deploy Barberuy-dev-env --staged --label barberuy-dev-env-api-${{github.event.repository.pushed_at}}
        
