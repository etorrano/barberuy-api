name: ci-dev
on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    
    steps:    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Prisma Generate
        run: npm run prisma:generate

      - name: Build
        run: npm run build

      - name: Compress Files
        run: zip --symlinks -r barberuy-api.zip .

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Deploy to AWS Elastic BeanTalk
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          aws_access_key: ${{vars.AWS_ACCESS_KEY_ID}}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: barberuy-dev
          environment_name: Barberuy-dev-env
          version_label: ver-${{ github.sha }}
          use_existing_version_if_available: true
          region: ${{vars.AWS_REGION}}
          deployment_package: barberuy-api.zip
        
