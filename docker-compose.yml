services:
  postgres:
    container_name: postgres_container
    image: postgres:16.3
    ports:
      - 5434:5432
    environment:
      POSTGRES_USER: barberuyadmin
      POSTGRES_PASSWORD: /run/secrets/db_root_password
      POSTGRES_DB: barberuydevdb
    secrets:
      - db_root_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

secrets:
  db_root_password:
    file: db_root_password.txt