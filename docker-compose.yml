services:
  postgres:
    container_name: postgres_container
    image: postgres:16.3
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: barberuyadmin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_root_password
      POSTGRES_DB: barberuydevdb
    secrets:
      - db_root_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
secrets:
  db_root_password:
    file: db_root_password.txt
volumes:
  postgres_data:
    driver_opts:
      type: tmpfs
      device: tmpfs